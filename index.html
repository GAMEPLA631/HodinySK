<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronos Global - Ultra Modern Timepiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f3ff;
            --accent-soft: rgba(0, 243, 255, 0.2);
            --bg: #030303;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .header-font {
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 0.3em;
        }

        /* Dynamické gradientové pozadie */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vw;
            background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
            pointer-events: none;
        }

        /* Ultra moderný sklenený panel */
        .main-stage {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            width: 100%;
        }

        /* Auth Overlay */
        #authOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin: auto;
        }

        .auth-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 14px;
            color: white;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.3s;
            font-size: 0.9rem;
        }

        .auth-input:focus {
            border-color: var(--accent);
        }

        .auth-btn {
            width: 100%;
            background: var(--accent);
            color: black;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        /* Analógové hodiny - responzívne */
        .clock-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            transition: all 0.5s ease;
        }

        @media (max-width: 480px) {
            .clock-container {
                width: 220px;
                height: 220px;
            }
        }

        .clock-outer {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 20px;
            transition: transform 0.1s cubic-bezier(0.4, 2.3, 0.3, 1);
        }

        .h-hand { width: 6px; height: 30%; background: white; z-index: 3; }
        .m-hand { width: 4px; height: 40%; background: var(--accent); z-index: 4; }
        .s-hand { width: 1.5px; height: 45%; background: #ff0055; z-index: 5; }

        .center-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 15px var(--accent);
        }

        /* Digitálny čas */
        .digital-time {
            font-size: clamp(3.5rem, 15vw, 8rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, #fff 50%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variant-numeric: tabular-nums;
            transition: all 0.5s ease;
        }

        /* Režimy zobrazenia */
        .mode-digital-only .clock-container { display: none; }
        .mode-analog-only .digital-time { display: none; }

        /* Mobilne optimalizovaný Select */
        .search-container {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        select {
            appearance: none;
            background: rgba(15, 15, 15, 0.9) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px 24px;
            border-radius: 18px;
            color: white;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        select:focus {
            border-color: var(--accent);
        }

        option {
            background-color: #111;
            color: white;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .tag-dst { background: var(--accent); color: black; }
        .tag-standard { background: #333; color: #999; }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 24px;
        }

        .info-box {
            text-align: center;
            padding: 15px 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .view-mode-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .view-mode-btn.active {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
        }

        #registrationFields {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        #registrationFields::-webkit-scrollbar {
            width: 4px;
        }
        #registrationFields::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .info-grid { grid-template-columns: 1fr; }
            .digital-time { margin-top: 1rem; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body class="p-4 md:p-6">
    <!-- Auth Screen -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2 class="header-font text-xl mb-4 font-bold">SECUR<span class="text-cyan-400">SYNC</span></h2>
            <div id="authMessage" class="text-xs text-red-400 mb-4 hidden"></div>
            
            <div id="loginForm">
                <input type="tel" id="loginPhone" class="auth-input" placeholder="Telefónne číslo">
                <input type="password" id="loginPass" class="auth-input" placeholder="Heslo">
                <button onclick="handleLogin()" class="auth-btn mb-3">Prihlásiť sa</button>
                <p class="text-[10px] text-gray-500 mb-3">Nemáte účet?</p>
                <button onclick="toggleAuthMode(true)" class="text-xs text-cyan-400 underline uppercase tracking-widest">Zaregistrovať sa</button>
            </div>

            <div id="registerForm" class="hidden">
                <div id="registrationFields">
                    <!-- 1. Phone -->
                    <input type="tel" id="regPhone" class="auth-input" placeholder="1. Telefónne číslo">
                    <!-- 2. Password -->
                    <input type="password" id="regPass" class="auth-input" placeholder="2. Heslo (bez obmedzenia)">
                    <!-- 3. Name -->
                    <input type="text" id="regName" class="auth-input" placeholder="3. Celé meno">
                    <!-- 4. Birth Date -->
                    <input type="date" id="regBirth" class="auth-input" placeholder="4. Dátum narodenia">
                    <!-- 5. Email -->
                    <input type="email" id="regEmail" class="auth-input" placeholder="5. Emailová adresa">
                    <!-- 6. City -->
                    <input type="text" id="regCity" class="auth-input" placeholder="6. Mesto">
                    <!-- 7. Country -->
                    <input type="text" id="regCountry" class="auth-input" placeholder="7. Krajina">
                    <!-- 8. Occupation -->
                    <input type="text" id="regJob" class="auth-input" placeholder="8. Povolanie">
                    <!-- 9. Bio -->
                    <input type="text" id="regBio" class="auth-input" placeholder="9. Krátky životopis">
                    <!-- 10. Favorite Zone -->
                    <input type="text" id="regZone" class="auth-input" placeholder="10. Obľúbené časové pásmo">
                </div>
                <button onclick="handleRegister()" class="auth-btn mb-3">Vytvoriť účet</button>
                <button onclick="toggleAuthMode(false)" class="text-xs text-gray-500 underline uppercase tracking-widest">Späť na prihlásenie</button>
            </div>
        </div>
    </div>

    <div class="bg-glow" id="glow"></div>

    <header class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6 w-full max-w-7xl mx-auto">
        <div class="header-font text-base md:text-lg font-bold tracking-widest">CHRONOS<span class="text-cyan-400">.</span>GLOBAL</div>
        
        <div class="flex items-center gap-3">
            <div class="flex gap-1 bg-white/5 p-1 rounded-xl">
                <button onclick="setViewMode('hybrid')" id="btn-hybrid" class="view-mode-btn active">Hybrid</button>
                <button onclick="setViewMode('digital')" id="btn-digital" class="view-mode-btn">Digital</button>
                <button onclick="setViewMode('analog')" id="btn-analog" class="view-mode-btn">Analog</button>
            </div>
            <select id="langSelector" class="!py-1.5 !px-3 !text-xs !w-auto !bg-black/40 !border-white/10" onchange="changeLanguage()">
                <option value="sk">SK</option>
                <option value="en">EN</option>
                <option value="de">DE</option>
                <option value="jp">JP</option>
            </select>
            <button onclick="logout()" class="text-[10px] opacity-50 hover:opacity-100 uppercase tracking-tighter">Odhlásiť</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center max-w-5xl mx-auto w-full">
        <!-- Search Section -->
        <div class="search-container mb-6">
            <select id="timezoneSelect" onchange="handleTimezoneChange()">
                <!-- JS Population -->
            </select>
            <div class="absolute right-6 top-1/2 -translate-y-1/2 pointer-events-none opacity-50 text-[10px] text-cyan-400">▼</div>
        </div>

        <!-- Clock Stage -->
        <div id="mainStage" class="main-stage p-6 md:p-12 flex flex-col items-center relative overflow-hidden">
            <div id="dayNightLabel" class="absolute top-6 left-8 text-[9px] uppercase tracking-[0.4em] opacity-40">--</div>
            
            <div class="flex flex-col lg:flex-row items-center gap-8 lg:gap-16 w-full">
                <!-- Analog -->
                <div class="clock-container" id="clockContainer">
                    <div class="clock-outer">
                        <div class="center-dot"></div>
                        <div class="hand h-hand" id="h-hand"></div>
                        <div class="hand m-hand" id="m-hand"></div>
                        <div class="hand s-hand" id="s-hand"></div>
                    </div>
                </div>

                <!-- Digital & Info -->
                <div class="text-center lg:text-left flex-1">
                    <div class="flex items-center gap-3 justify-center lg:justify-start mb-1">
                        <h2 id="cityName" class="header-font text-lg md:text-2xl font-bold">LOKÁLNY ČAS</h2>
                        <span id="dstTag" class="tag tag-standard">--</span>
                    </div>
                    <div class="digital-time" id="digitalTime">00:00:00</div>
                    <p id="fullDate" class="text-sm md:text-xl text-gray-500 mt-1 font-light italic">--</p>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="info-grid">
                <div class="info-box">
                    <p class="text-[9px] uppercase text-gray-500 tracking-widest mb-1" id="label-utc">Posun voči UTC</p>
                    <p class="text-base md:text-xl font-bold text-cyan-400" id="utc-offset">+0:00</p>
                </div>
                <div class="info-box">
                    <p class="text-[9px] uppercase text-gray-500 tracking-widest mb-1" id="label-update">Sila signálu</p>
                    <p class="text-base md:text-xl font-bold" id="signal-status">AKTÍVNY</p>
                </div>
                <div class="info-box">
                    <p class="text-[9px] uppercase text-gray-500 tracking-widest mb-1" id="label-next">Zmena času</p>
                    <p class="text-base md:text-xl font-bold" id="next-change">--</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-6 mb-4 text-center text-[9px] text-gray-600 uppercase tracking-widest">
        Quantum Engine v6.0 Mobile // Multiversal Sync // Secured by IndexedDB
    </footer>

    <script>
        // DATABASE LOGIC (IndexedDB)
        const DB_NAME = 'ChronosGlobalDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'users';
        let db;

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'phone' });
            }
        };
        request.onsuccess = (e) => { db = e.target.result; checkPersistentLogin(); };
        request.onerror = (e) => console.error("Database error", e);

        function showAuthMsg(msg, isError = true) {
            const el = document.getElementById('authMessage');
            el.textContent = msg;
            el.classList.remove('hidden');
            el.className = isError ? 'text-xs text-red-400 mb-4' : 'text-xs text-cyan-400 mb-4';
        }

        function toggleAuthMode(register) {
            document.getElementById('loginForm').classList.toggle('hidden', register);
            document.getElementById('registerForm').classList.toggle('hidden', !register);
            document.getElementById('authMessage').classList.add('hidden');
        }

        async function handleRegister() {
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const name = document.getElementById('regName').value.trim();
            const birth = document.getElementById('regBirth').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const city = document.getElementById('regCity').value.trim();
            const country = document.getElementById('regCountry').value.trim();
            const job = document.getElementById('regJob').value.trim();
            const bio = document.getElementById('regBio').value.trim();
            const zone = document.getElementById('regZone').value.trim();

            if (!phone || !pass || !name || !birth || !email || !city || !country || !job || !bio || !zone) {
                return showAuthMsg("Musíte vyplniť všetkých 10 údajov!");
            }

            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            
            const checkRequest = store.get(phone);
            checkRequest.onsuccess = () => {
                if (checkRequest.result) {
                    showAuthMsg("Toto číslo je už zaregistrované.");
                } else {
                    store.add({ 
                        phone, pass, name, birth, email, city, country, job, bio, zone 
                    });
                    showAuthMsg("Registrácia úspešná! Môžete sa prihlásiť.", false);
                    setTimeout(() => toggleAuthMode(false), 1500);
                }
            };
        }

        async function handleLogin() {
            const phone = document.getElementById('loginPhone').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const getReq = store.get(phone);

            getReq.onsuccess = () => {
                const user = getReq.result;
                if (user && user.pass === pass) {
                    localStorage.setItem('chronos_logged_in', phone);
                    document.getElementById('authOverlay').classList.add('hidden');
                } else {
                    showAuthMsg("Nesprávne telefónne číslo alebo heslo.");
                }
            };
        }

        function checkPersistentLogin() {
            if (localStorage.getItem('chronos_logged_in')) {
                document.getElementById('authOverlay').classList.add('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('chronos_logged_in');
            document.getElementById('authOverlay').classList.remove('hidden');
            showAuthMsg("Boli ste odhlásení.", false);
            toggleAuthMode(false);
        }

        // APP LOGIC
        const translations = {
            sk: { utc: "Posun voči UTC", update: "Motor času", next: "Ďalšia zmena", signal: "AKTÍVNY", dstActive: "Letný čas", dstInactive: "Zimný čas", day: "Deň", night: "Noc" },
            en: { utc: "UTC Offset", update: "Time Engine", next: "Next Change", signal: "ACTIVE", dstActive: "Daylight Saving", dstInactive: "Standard Time", day: "Day", night: "Night" },
            de: { utc: "UTC Offset", update: "Zeitmotor", next: "Nächste Änderung", signal: "AKTIV", dstActive: "Sommerzeit", dstInactive: "Winterzeit", day: "Tag", night: "Nacht" },
            jp: { utc: "UTCオフセット", update: "タイムエンジン", next: "次の変更", signal: "アクティブ", dstActive: "夏時間", dstInactive: "標準時", day: "昼", night: "夜" }
        };

        let currentLang = 'sk';
        let currentTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let viewMode = 'hybrid'; 

        const timezones = Intl.supportedValuesOf('timeZone');

        function init() {
            populateTimezones();
            updateUI();
            
            if (window.innerWidth < 480) {
                setViewMode('digital');
            }

            setInterval(tick, 1000);
            tick();
        }

        function populateTimezones() {
            const select = document.getElementById('timezoneSelect');
            if(!select) return;
            const groups = {};
            timezones.forEach(tz => {
                const continent = tz.split('/')[0];
                if (!groups[continent]) groups[continent] = [];
                groups[continent].push(tz);
            });

            for (const continent in groups) {
                const optGroup = document.createElement('optgroup');
                optGroup.label = continent.toUpperCase();
                groups[continent].forEach(tz => {
                    const opt = document.createElement('option');
                    opt.value = tz;
                    const parts = tz.split('/');
                    const city = parts[parts.length - 1].replace(/_/g, ' ');
                    opt.textContent = city;
                    if (tz === currentTimezone) opt.selected = true;
                    optGroup.appendChild(opt);
                });
                select.appendChild(optGroup);
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            const stage = document.getElementById('mainStage');
            if(!stage) return;
            stage.className = `main-stage p-6 md:p-12 flex flex-col items-center relative overflow-hidden mode-${mode}-only`;
            
            ['hybrid', 'digital', 'analog'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (btn) btn.classList.toggle('active', m === mode);
            });
        }

        function handleTimezoneChange() {
            currentTimezone = document.getElementById('timezoneSelect').value;
            const parts = currentTimezone.split('/');
            document.getElementById('cityName').textContent = parts[parts.length - 1].replace(/_/g, ' ').toUpperCase();
            updateUI();
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelector').value;
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('label-utc').textContent = t.utc;
            document.getElementById('label-update').textContent = t.update;
            document.getElementById('label-next').textContent = t.next;
            document.getElementById('signal-status').textContent = t.signal;
        }

        function tick() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: currentTimezone,
                hour: 'numeric', minute: 'numeric', second: 'numeric',
                year: 'numeric', month: 'long', day: 'numeric',
                hour12: false
            });

            const parts = formatter.formatToParts(now);
            const h = parseInt(parts.find(p => p.type === 'hour').value);
            const m = parseInt(parts.find(p => p.type === 'minute').value);
            const s = parseInt(parts.find(p => p.type === 'second').value);
            
            document.getElementById('digitalTime').textContent = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            const dateStr = now.toLocaleDateString(currentLang === 'sk' ? 'sk-SK' : 'en-US', { 
                timeZone: currentTimezone, weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            document.getElementById('fullDate').textContent = dateStr;

            const sDeg = (s / 60) * 360;
            const mDeg = (m / 60) * 360 + (s / 60) * 6;
            const hDeg = (h % 12 / 12) * 360 + (m / 60) * 30;

            document.getElementById('s-hand').style.transform = `translateX(-50%) rotate(${sDeg}deg)`;
            document.getElementById('m-hand').style.transform = `translateX(-50%) rotate(${mDeg}deg)`;
            document.getElementById('h-hand').style.transform = `translateX(-50%) rotate(${hDeg}deg)`;

            updateMeta(now);
            
            const isNight = h < 6 || h > 19;
            document.getElementById('glow').style.background = isNight 
                ? 'radial-gradient(circle, rgba(188, 19, 254, 0.15) 0%, transparent 70%)'
                : 'radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, transparent 70%)';
            document.getElementById('dayNightLabel').textContent = isNight ? translations[currentLang].night : translations[currentLang].day;
        }

        function updateMeta(now) {
            const t = translations[currentLang];
            const tzParts = new Intl.DateTimeFormat('en-US', { timeZone: currentTimezone, timeZoneName: 'shortOffset' }).formatToParts(now);
            const tzName = tzParts.find(p => p.type === 'timeZoneName').value;
            document.getElementById('utc-offset').textContent = tzName;

            const isDST = checkDST(currentTimezone);
            const tag = document.getElementById('dstTag');
            tag.textContent = isDST ? t.dstActive : t.dstInactive;
            tag.className = `tag ${isDST ? 'tag-dst' : 'tag-standard'}`;

            const nextChange = isDST ? "Október" : "Marec";
            document.getElementById('next-change').textContent = nextChange + " " + now.getFullYear();
        }

        function checkDST(timezone) {
            const now = new Date();
            const getStdOffset = (tz) => {
                const date = new Date();
                const jan = new Date(date.getFullYear(), 0, 1);
                const jul = new Date(date.getFullYear(), 6, 1);
                const std = Math.max(
                    new Date(jan.toLocaleString('en-US', {timeZone: tz})).getTimezoneOffset(),
                    new Date(jul.toLocaleString('en-US', {timeZone: tz})).getTimezoneOffset()
                );
                return std;
            };
            const current = new Date(now.toLocaleString('en-US', {timeZone: timezone})).getTimezoneOffset();
            return current < getStdOffset(timezone);
        }

        window.onload = init;
    </script>
</body>
</html>
